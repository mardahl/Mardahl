name: Copilot Spend Badge

on:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Fetch all 24 months of history (one-time seeding)'
        type: boolean
        default: false

permissions:
  contents: write # needed to commit assets/copilot-card.svg back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update Copilot badge gist
        env:
          BILLING_PAT: ${{ secrets.BILLING_PAT }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GH_ORG: ${{ vars.GH_ORG }}
          GH_LOGIN: ${{ vars.GH_LOGIN }}
          GIST_ID: ${{ vars.GIST_ID }}
          BACKFILL: ${{ inputs.backfill == true && '1' || '0' }}
        run: node scripts/copilot-badge.mjs
      - name: Commit updated SVG card
        run: |
          if git diff --quiet assets/copilot-card.svg 2>/dev/null; then
            echo "Card unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/copilot-card.svg
          git commit -m "Update Copilot AI credits card [skip ci]"
          git push
